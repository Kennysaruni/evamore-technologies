<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Primary Brand Orange Gradient -->
    <linearGradient id="ev-orange-grad" x1="18" y1="14" x2="102" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#D94E00" />
    </linearGradient>

    <!-- Warm Glass Fill Gradient -->
    <linearGradient id="ev-glass-fill" x1="20" y1="12" x2="100" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F1A17" />
      <stop offset="55%" stop-color="#121215" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>

    <!-- Glassmorphic Specular Rim -->
    <linearGradient id="ev-glass-rim" x1="24" y1="14" x2="96" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#FF7A1A" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.12" />
    </linearGradient>

    <!-- Translucent Secondary Facet (Glass Layer) -->
    <linearGradient id="ev-inner-glass" x1="52" y1="32" x2="96" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.06" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="ev-glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B00" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- 1. Outer Rounded Hexagon Base (Obsidian Glass + Specular Border) -->
  <path
    d="M53.07 13.00 C57.36 10.52 62.64 10.52 66.93 13.00 L97.57 30.69 C101.86 33.17 104.50 37.74 104.50 42.69 L104.50 77.31 C104.50 82.26 101.86 86.83 97.57 89.31 L66.93 107.00 C62.64 109.48 57.36 109.48 53.07 107.00 L22.43 89.31 C18.14 86.83 15.50 82.26 15.50 77.31 L15.50 42.69 C15.50 37.74 18.14 33.17 22.43 30.69 Z"
    fill="url(#ev-glass-fill)"
    stroke="url(#ev-glass-rim)"
    stroke-width="2.5"
  />

  <!-- 2. Inner Glassmorphic Hex-Portal Facet (Right Half Depth Layer) -->
  <path
    d="M60 22 L91 39.9 C93.5 41.3 95 44.0 95 46.9 L95 73.1 C95 76.0 93.5 78.7 91 80.1 L60 98 L60 22 Z"
    fill="url(#ev-inner-glass)"
  />

  <!-- 3. Structural Roofline + "E" Backbone (Left & Peak Facets) -->
  <path
    d="M78 33.5 L62.6 24.6 C60.99 23.67 59.01 23.67 57.4 24.6 L31.2 39.7 C29.22 40.84 28 42.95 28 45.24 L28 74.76 C28 77.05 29.22 79.16 31.2 80.3 L57.4 95.4 C59.01 96.33 60.99 96.33 62.6 95.4 L78 86.5"
    stroke="url(#ev-orange-grad)"
    stroke-width="9.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#ev-glow)"
  />

  <!-- 4. Quote-to-Booking Forward Signal Arrow (Center E Crossbar + Conversion Chevron) -->
  <path
    d="M30 60 L79 60 M66 47.5 L80.5 60 L66 72.5"
    stroke="#FFFFFF"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 5. Instant Alert Pulse Dot (Top-Right Active Beacon) -->
  <circle cx="88" cy="40" r="5" fill="#FF6B00" />
  <circle cx="88" cy="40" r="8.5" stroke="#FF8A3D" stroke-width="1.5" stroke-opacity="0.45" />
</svg>
